worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream api_auth {
        server api-auth-java:8082;
    }

    upstream api_core {
        server api-core-java:8081;
    }

    server {
        listen 80;

	location /api/auth {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://api_auth;
        }

        location /api/posts {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://api_core;
        }

        location /api/post {
            proxy_pass http://api_core/api/post;
        }

        location /api/postuser {
            proxy_pass http://api_core/api/postuser;
        }

        location /api/postreport {
            proxy_pass http://api_core/api/postreport;
        }

        location /api/botten {
            proxy_pass http://api_core/api/botten;
        }
    }
}

